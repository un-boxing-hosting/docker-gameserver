---
services:
  # bind mount example
  linuxgsm-ck-bind:
    # image: gameservermanagers/gameserver:ck
    image: ghcr.io/un-boxing-hosting/gameserver:ck
    container_name: ckserver
    restart: unless-stopped
    volumes:
      - /path/to/linuxgsm/ckserver:/data
    network_mode: host

  # volume example
  linuxgsm-ck-volume:
    # image: gameservermanagers/gameserver:ck
    image: ghcr.io/un-boxing-hosting/gameserver:ck
    container_name: ckserver
    restart: unless-stopped
    volumes:
      - linuxgsm-ck:/data
    network_mode: host

volumes:
  linuxgsm-ck:
