---
services:
  # bind mount example
  linuxgsm-gmod-bind:
   # image: gameservermanagers/gameserver:gmod
    image: ghcr.io/un-boxing-hosting/gameserver:gmod
    container_name: gmodserver
    restart: unless-stopped
    volumes:
      - /path/to/linuxgsm/gmodserver:/data
    network_mode: host

  # volume example
  linuxgsm-gmod-volume:
    # image: gameservermanagers/gameserver:gmod
    image: ghcr.io/un-boxing-hosting/gameserver:gmod
    container_name: gmodserver
    restart: unless-stopped
    volumes:
      - linuxgsm-gmod:/data
    network_mode: host

volumes:
  linuxgsm-gmod:
