---
services:
  # bind mount example
  linuxgsm-zmr-bind:
   # image: gameservermanagers/gameserver:zmr
     image: ghcr.io/un-boxing-hosting/gameserver:zmr
    container_name: zmrserver
    restart: unless-stopped
    volumes:
      - /path/to/linuxgsm/zmrserver:/data
    network_mode: host

  # volume example
  linuxgsm-zmr-volume:
    # image: gameservermanagers/gameserver:zmr
    image: ghcr.io/un-boxing-hosting/gameserver:zmr
    container_name: zmrserver
    restart: unless-stopped
    volumes:
      - linuxgsm-zmr:/data
    network_mode: host

volumes:
  linuxgsm-zmr:
